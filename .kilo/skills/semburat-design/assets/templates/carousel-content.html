<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <style>
      {{tokens_css}}
      {{base_css}}
      .cv { width: 1080px; height: 1350px; }

      .cv { padding: 72px; }
      .top { display: flex; justify-content: space-between; align-items: center; }
      .kicker { font-size: 24px; padding: 8px 22px; }
      .num { font-family: var(--sb-font-heading); font-weight: 800; font-size: 26px; color: var(--sb-muted); }
      .title { margin-top: 28px; }
      .sz-l .title { font-size: 72px; } .sz-m .title { font-size: 62px; } .sz-s .title { font-size: 52px; }
      .body { margin-top: 32px; font-size: 44px; }
      .wm { font-size: 26px; } .credit { font-size: 20px; }
      .glow { width: 520px; height: 520px; right: -180px; bottom: -200px; }
    </style>
  </head>
  <body>
    <div class="cv {{size_class}}">
      <div class="glow"></div>
      <div>
        <div class="top">
          <span class="kicker">{{kicker}}</span
          ><span class="num">{{slide_no}} / {{slide_total}}</span>
        </div>
        <h2 class="title">{{title}}</h2>
        <p class="body">{{body}}</p>
      </div>
      <div class="footer">
        <div class="wm">SEMBURAT</div>
        <div class="credit">{{credit_html}}</div>
      </div>
    </div>
  </body>
</html>
