name: Deploy

# Required GitHub Secrets:
#   - CLOUDFLARE_API_TOKEN    Cloudflare API token with D1, Workers and Pages access
#   - CLOUDFLARE_ACCOUNT_ID   Cloudflare account ID
# Required config (apps/worker/wrangler.jsonc):
#   - real D1 database_id values, created once with:
#       cd apps/worker && wrangler d1 create semburat-db --env staging
#       cd apps/worker && wrangler d1 create semburat-db --env production
#   Placeholder "@cf/db-id*" values make the deploy and migration steps skip/fail loudly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy-production:
    name: Deploy to Production
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Check D1 configuration
        id: d1
        run: |
          if grep -q '@cf/db-id' apps/worker/wrangler.jsonc; then
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            echo "::warning::wrangler.jsonc still contains placeholder D1 database IDs; skipping migrations."
          else
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.d1.outputs.resolved == 'true'
        run: cd apps/worker && wrangler d1 migrations apply semburat-db --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: cd apps/worker && wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Web
        run: |
          cd apps/web
          npx astro build
          wrangler pages deploy dist --project-name=semburat-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-staging:
    name: Deploy to Staging
    needs: test-and-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Check D1 configuration
        id: d1
        run: |
          if grep -q '@cf/db-id' apps/worker/wrangler.jsonc; then
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            echo "::warning::wrangler.jsonc still contains placeholder D1 database IDs; skipping migrations."
          else
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.d1.outputs.resolved == 'true'
        run: cd apps/worker && wrangler d1 migrations apply semburat-db-staging --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: cd apps/worker && wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Web
        run: |
          cd apps/web
          npx astro build
          wrangler pages deploy dist --project-name=semburat-web-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
