name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run custom secret scan
        id: custom-scan
        run: |
          if [ -f scripts/check-secrets.sh ]; then
            bash scripts/check-secrets.sh
          else
            echo "No custom secret scan script found."
          fi
        continue-on-error: true

      - name: Run gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Fail if secrets detected
        if: steps.custom-scan.outcome == 'failure' || steps.gitleaks.outcome == 'failure'
        run: |
          echo "Secrets detected in this PR/Push."
          echo "Custom scan: ${{ steps.custom-scan.outcome }}"
          echo "Gitleaks: ${{ steps.gitleaks.outcome }}"
          exit 1

      - name: Post findings as PR comment
        if: steps.custom-scan.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## Secret Scan Failed\n\nPotential secrets were detected in this PR. Please review and remove or externalize them before merging.\n\nRun `scripts/check-secrets.sh` locally to see the findings.'
            })
