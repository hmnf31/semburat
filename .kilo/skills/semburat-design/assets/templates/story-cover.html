<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <style>
      {{tokens_css}}
      {{base_css}}
      .cv { width: 1080px; height: 1920px; }

      .cv { padding: 250px 64px 340px 64px; }
      .kicker { font-size: 30px; padding: 12px 28px; }
      .title { margin-top: 36px; }
      .sz-l .title { font-size: 92px; } .sz-m .title { font-size: 78px; } .sz-s .title { font-size: 64px; }
      .body { margin-top: 28px; font-size: 38px; }
      .wm { font-size: 30px; } .credit, .ai-badge { font-size: 22px; } .ai-badge { padding: 4px 12px; }
      .glow { width: 760px; height: 760px; left: -240px; top: 120px; }
    </style>
  </head>
  <body>
    <div class="cv {{image_class}} {{size_class}}" {{bg_style}}>
      <div class="glow"></div>
      <div>
        <span class="kicker">{{kicker}}</span>
        <h1 class="title">{{title}}</h1>
        <p class="body muted">{{body}}</p>
      </div>
      <div class="footer">
        <div class="wm">SEMBURAT</div>
        <div class="credit">{{credit_html}}</div>
      </div>
    </div>
  </body>
</html>
