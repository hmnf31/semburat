<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <style>
      {{tokens_css}}
      {{base_css}}
      .cv { width: 1080px; height: 1350px; }

      .cv { padding: 72px; }
      .kicker { font-size: 26px; padding: 10px 24px; }
      .title { margin-top: 28px; }
      .sz-l .title { font-size: 84px; } .sz-m .title { font-size: 72px; } .sz-s .title { font-size: 60px; }
      .swipe { font-size: 26px; font-weight: 700; color: var(--sb-primary); margin-top: 32px; }
      .wm { font-size: 26px; } .credit, .ai-badge { font-size: 20px; } .ai-badge { padding: 4px 12px; }
      .glow { width: 640px; height: 640px; right: -200px; top: -200px; }
    </style>
  </head>
  <body>
    <div class="cv {{image_class}} {{size_class}}" {{bg_style}}>
      <div class="glow"></div>
      <div>
        <span class="kicker">{{kicker}}</span>
        <h1 class="title">{{title}}</h1>
        <div class="swipe">Geser untuk lanjut →</div>
      </div>
      <div class="footer">
        <div class="wm">SEMBURAT</div>
        <div class="credit">{{credit_html}}</div>
      </div>
    </div>
  </body>
</html>
