# Push -> Lint -> Test -> Build (PRD bagian 52). Sesuaikan perintah dengan repo Anda.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit test aturan inti & validasi desain
        run: python -m unittest discover -s tests -v

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Hapus 'if' ini jika apps/web sudah ada dan ingin selalu dibangun.
    if: ${{ hashFiles('apps/web/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
