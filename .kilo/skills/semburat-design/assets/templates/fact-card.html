<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <style>
      {{tokens_css}}
      {{base_css}}
      .cv { width: 1080px; height: 1080px; }

      .cv { padding: 72px; }
      .kicker { font-size: 26px; padding: 10px 24px; }
      .stat { font-family: var(--sb-font-heading); font-weight: 800; font-size: 150px; line-height: 1; margin-top: 36px; background: var(--sb-grad-accent); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .title { margin-top: 24px; }
      .sz-l .title { font-size: 60px; } .sz-m .title { font-size: 52px; } .sz-s .title { font-size: 44px; }
      .body { margin-top: 24px; font-size: 34px; }
      .wm { font-size: 26px; } .credit, .ai-badge { font-size: 20px; } .ai-badge { padding: 4px 12px; }
      .glow { width: 560px; height: 560px; right: -160px; bottom: -200px; }
    </style>
  </head>
  <body>
    <div class="cv {{image_class}} {{size_class}}" {{bg_style}}>
      <div class="glow"></div>
      <div>
        <span class="kicker">{{kicker}}</span>
        <div class="stat">{{stat}}</div>
        <h1 class="title">{{title}}</h1>
        <p class="body muted">{{body}}</p>
      </div>
      <div class="footer">
        <div class="wm">SEMBURAT</div>
        <div class="credit">{{credit_html}}</div>
      </div>
    </div>
  </body>
</html>
