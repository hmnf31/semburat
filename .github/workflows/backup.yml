name: Backup

on:
  schedule:
    - cron: '2 2 * * *'
  workflow_dispatch:
    inputs:
      database_name:
        description: 'D1 database name'
        required: false
        default: 'semburat-db'
      bucket_name:
        description: 'R2 backup bucket name'
        required: false
        default: 'semburat-backups'

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup-d1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run D1 backup
        run: scripts/backup-d1.sh
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_NAME: ${{ github.event.inputs.database_name || 'semburat-db' }}
          R2_BACKUP_BUCKET: ${{ github.event.inputs.bucket_name || 'semburat-backups' }}

      - name: Verify backup in R2
        run: npx wrangler r2 object list ${{ github.event.inputs.bucket_name || 'semburat-backups' }} --prefix d1/ --limit 5
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
