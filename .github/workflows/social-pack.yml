name: Social Pack

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain for links and CTA'
        required: false
        default: 'semburat-web.pages.dev'
      formats:
        description: 'Comma-separated formats to build'
        required: false
        default: 'og-hero,x-post,fact-card,story-cover,carousel'

permissions:
  contents: read

concurrency:
  group: social-pack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (Chromium)
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Export published articles
        run: pnpm articles:export

      - name: Build social packs
        run: |
          python tools/social_pack.py \
            --articles social-out/articles.json \
            --out social-out/packs \
            --assets-dir apps/web/src/assets/articles \
            --domain "${{ github.event.inputs.domain }}" \
            --formats "${{ github.event.inputs.formats }}"

      - name: Upload packs
        uses: actions/upload-artifact@v4
        with:
          name: social-packs
          path: social-out/
          retention-days: 30
