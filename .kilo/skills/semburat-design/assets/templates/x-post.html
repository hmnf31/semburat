<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <style>
      {{tokens_css}}
      {{base_css}}
      .cv { width: 1600px; height: 900px; }

      .cv { padding: 80px; }
      .kicker { font-size: 28px; padding: 10px 26px; }
      .title { margin-top: 28px; max-width: 1300px; }
      .sz-l .title { font-size: 96px; } .sz-m .title { font-size: 78px; } .sz-s .title { font-size: 62px; }
      .wm { font-size: 28px; } .credit, .ai-badge { font-size: 20px; } .ai-badge { padding: 4px 12px; }
      .glow { width: 700px; height: 700px; right: -200px; top: -240px; }
    </style>
  </head>
  <body>
    <div class="cv {{image_class}} {{size_class}}" {{bg_style}}>
      <div class="glow"></div>
      <div>
        <span class="kicker">{{kicker}}</span>
        <h1 class="title">{{title}}</h1>
      </div>
      <div class="footer">
        <div class="wm">SEMBURAT</div>
        <div class="credit">{{credit_html}}</div>
      </div>
    </div>
  </body>
</html>
