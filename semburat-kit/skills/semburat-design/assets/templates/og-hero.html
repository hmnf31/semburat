<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <style>
      {{tokens_css}}
      {{base_css}}
      .cv { width: 1200px; height: 630px; }

      .cv { padding: 56px; }
      .kicker { font-size: 22px; padding: 8px 20px; }
      .title { margin-top: 20px; max-width: 1000px; }
      .sz-l .title { font-size: 68px; } .sz-m .title { font-size: 56px; } .sz-s .title { font-size: 46px; }
      .wm { font-size: 22px; } .credit, .ai-badge { font-size: 16px; } .ai-badge { padding: 3px 10px; }
      .glow { width: 520px; height: 520px; right: -140px; top: -160px; }
    </style>
  </head>
  <body>
    <div class="cv {{image_class}} {{size_class}}" {{bg_style}}>
      <div class="glow"></div>
      <div>
        <span class="kicker">{{kicker}}</span>
        <h1 class="title">{{title}}</h1>
      </div>
      <div class="footer">
        <div class="wm">SEMBURAT</div>
        <div class="credit">{{credit_html}}</div>
      </div>
    </div>
  </body>
</html>
